<body style="margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; text-align: center;">

    <div class="wrapper" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; padding: 20px; max-width: 90%; margin: auto;">
        <!-- Logo -->
        <img src="assets/img/brand/logov5.svg" alt="GastroSat Logo" class="logo">

        <!-- Caja de contenido sin borde -->
        <div class="content" style="width: 100%; max-width: 650px; padding: 20px; text-align: left;">
            <h2>📩 Contacto</h2>
            <p>Si tienes alguna consulta o necesitas asistencia, rellena el formulario y te responderemos lo antes posible.</p>
            <br>
            <form action="https://formspree.io/f/mvgkgjba" method="POST" style="text-align: left;">
                <label>
                    Nombre:
                    <input type="text" name="nombre">
                </label>   
                <label>
                    Correo electrónico:
                    <input type="email" name="email" required>
                </label>
                <label>
                    Teléfono:
                    <input type="tel" name="telefono">
                </label>
                <label>
                    Mensaje:
                    <textarea name="message"></textarea>
                </label>
                
                <input type="hidden" name="_next" value="https://gastrosat.com">
                
                <br>
                <button type="submit">Enviar</button>
            </form>
            <a href="/" style="display: inline-block; margin-top: 20px; font-size: 16px; text-decoration: none; color: #007bff; font-weight: bold;">
    ← Volver al inicio
</a>
        </div>
    </div>

            <!-- Contenedor para la notificación (inicialmente oculto) -->
<div id="success-message" style="
    display: none;
    background-color: #28a745;
    color: white;
    padding: 15px;
    text-align: center;
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 5px;
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    z-index: 1000;
">
    ✅ ¡Mensaje enviado correctamente!
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const form = document.querySelector("form");
        const successMessage = document.getElementById("success-message");

        if (form) {
            form.addEventListener("submit", function(event) {
                event.preventDefault();

                fetch(this.action, {
                    method: this.method,
                    body: new FormData(this),
                    headers: { 'Accept': 'application/json' }
                }).then(response => {
                    if (response.ok) {
                        successMessage.style.display = "block";
                        form.reset();
                        setTimeout(() => {
                            successMessage.style.display = "none";
                            window.location.href = "https://gastrosat.com";
                        }, 3000);
                    } else {
                        alert("Hubo un error al enviar el formulario.");
                    }
                }).catch(error => {
                    console.error("Error en la solicitud:", error);
                    alert("Hubo un problema de conexión. Inténtalo de nuevo.");
                });
            });
        } else {
            console.error("Formulario no encontrado en el DOM.");
        }
    });
</script>
